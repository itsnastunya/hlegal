<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

     <link rel="stylesheet" href="./style/reset.css">
    <link rel="stylesheet" href="./style/contact.css">
</head>
<body>
   <header class="header desctop header--light">
        <div class="container header__container">
            <a href="index.html" class="header__logo">
                <svg width="297" height="60">
                    <use xlink:href="./sprite.svg#logo-contact"></use>
                </svg>
            </a>

            <div class="header-content">
                <div class="top-block">
                    <div class="lang-switcher">
                        <button class="small-btn">УК</button>
                        <button class="small-btn">РУ</button>
                        <button class="small-btn active">EN</button>
                    </div>

                    <ul class="top-list">
                        <li><a href="#" class="top-list__address">Kyiv, Mechnikova str, 14/1</a></li>
                        <li><a class="top-list__phone" href="tel:0800211927">0800 211 927</a></li>
                        <li>
                            <a href="#" class="top-list__social" aria-label="Facebook">
                                <svg width="24" height="24" class="top-list__social-icon">
                                    <use xlink:href="./sprite.svg#icon-facebook"></use>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>

                <nav class="nav">
                    <a href="#" class="nav__link">about us</a>
                    <a href="#" class="nav__link">services</a>
                    <a href="#" class="nav__link">team</a>
                    <a href="#" class="nav__link">publications</a>
                    <a href="#" class="nav__link nav__link--active">contact</a>
                </nav>
            </div>
        </div>
    </header>


    <header class="header mobile header--light">
        <div class="header__top">
            <div class="lang-switcher">
                <button class="small-btn">УК</button>
                <button class="small-btn">РУ</button>
                <button class="small-btn active">EN</button>
            </div>
            <a class="top-list__phone" href="tel:0800211927">0800 211 927</a>
        </div>
        <div class="container header__container">
            <a href="index.html" class="header__logo">
                <svg width="166" height="57">
                    <use xlink:href="./sprite.svg#logo-contact"></use>
                </svg>
            </a>

            <label class="burger-menu" for="burger">
                <svg width="32" height="32" class="burger-menu__icon">
                    <use xlink:href="./sprite.svg#burger-default"></use>
                </svg>
            </label>
            <input type="checkbox" hidden id="burger">
            <div class="mobile-overlay"></div>
            <div class="header-mobile-dropdown">
                <label class="burger-menu" for="burger">
                    <svg width="32" height="32">
                        <use xlink:href="./sprite.svg#burger-close"></use>
                    </svg>
                </label>
                <ul>
                    <li><a href="#" class="link">about us</a></li>
                    <li><a href="#" class="link">services</a></li>
                    <li><a href="#" class="link">team</a></li>
                    <li><a href="#" class="link">publications</a></li>
                    <li><a href="#" class="link link--active">contact</a></li>
                </ul>
            </div>
        </div>
    </header> 

      <footer class="footer">
            <div class="container footer__container">
                <div class="footer__info">
                    <div class="footer__row">
                        <span class="footer__address">Kyiv, Mechnikova str, 14/1</span>
                        <a href="https://maps.app.goo.gl/y9jkHgbZWeBHmCza8" target="_blank" rel="noopener"
                            class="footer__map">on map</a>
                    </div>

                    <div class="footer__row">
                        <a href="#" class="footer__social" aria-label="Facebook">
                            <svg width="38" height="38" class="footer__social-icon">
                                <use xlink:href="./sprite.svg#icon-facebook"></use>
                            </svg>
                        </a>
                        <a href="tel:0800211927" class="footer__phone">0800 211 927</a>
                        <a href="mailto:contact@forstudy.space" class="footer__email">contact@forstudy.space</a>
                    </div>
                </div>

                <p class="footer__copy">© 2021 HLEGAL Law company, LLC</p>
            </div>
        </footer>
</body>
</html>
