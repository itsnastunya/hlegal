<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <link rel="stylesheet" href="./style/main.css">
</head>

<body>

    <div class="gradient">
        <svg class="gradient__bg-symbol" aria-hidden="true">
            <use xlink:href="./sprite.svg#hero-letter-h"></use>
        </svg>
        <header class="header desctop">
            <div class="container header__container">

                <a href="/" class="header__logo">
                    <svg width="130" height="60">
                        <use xlink:href="./sprite.svg#logo"></use>
                    </svg>
                </a>
                <div class="header-content">
                    <div class="top-block">
                        <div class="lang-switcher">
                            <button class="small-btn">УК</button>
                            <button class="small-btn">РУ</button>
                            <button class="small-btn active">EN</button>

                        </div>

                        <ul class="top-list">
                            <li><a href="#" class="top-list__address">Kyiv, Mechnikova str, 14/1</a></li>
                            <li><a class="top-list__phone" href="tel:0800211927"><b>0800 211 927</b></a></li>
                            <li>
                                <a href="#" class="top-list__social" aria-label="Facebook">
                                    <svg width="24" height="24" class="top-list__social-icon">
                                        <use xlink:href="./sprite.svg#icon-facebook"></use>
                                    </svg>
                                </a>
                            </li>
                        </ul>
                    </div>

                    <nav class="nav">
                        <a href="/" class="nav__link nav__link">about us</a>
                        <a href="/services.html" class="nav__link">services</a>
                        <a href="/team.html" class="nav__link">team</a>
                        <a href="/publications.html" class="nav__link">publications</a>
                        <a href="/contact.html" class="nav__link">contact</a>
                    </nav>
                </div>
            </div>
        </header>

        <header class="header mobile">
            <div class="header__top">
                <div class="lang-switcher">
                    <button class="small-btn">УК</button>
                    <button class="small-btn">РУ</button>
                    <button class="small-btn active">EN</button>
                </div>
                <a class="top-list__phone" href="tel:0800211927">0800 211 927</a>
            </div>
            <div class="container header__container">
                <a href="/" class="header__logo">
                    <svg width="69" height="32">
                        <use xlink:href="./sprite.svg#logo"></use>
                    </svg>
                    <span class="header__logo-slash">/</span>
                    <span class="header__logo-text">services</span>
                </a>


                <label class="burger-menu" for="burger">
                    <svg width="32" height="32" class="burger-menu__icon">
                        <use xlink:href="./sprite.svg#burger-default"></use>
                    </svg>
                </label>
                <input type="checkbox" hidden name="" id="burger">
                <div class="mobile-overlay"></div>
                <div class="header-mobile-dropdown">
                    <label class="burger-menu" for="burger">
                        <svg width="32" height="32">
                            <use xlink:href="./sprite.svg#burger-close"></use>
                        </svg>
                    </label>
                    <ul>
                        <li><a href="" class="link">about us</a></li>
                        <li><a href="" class="link">послуги</a></li>
                        <li><a href="" class="link">команда</a></li>
                        <li><a href="" class="link link--active">публікації</a></li>
                        <li><a href="" class="link">контакти</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <section class="hero">
            <div class="container hero__container">
                <div class="hero__banner">
                    <!-- <svg class="hero__bg-symbol" aria-hidden="true">
                        <use xlink:href="./sprite.svg#hero-letter-h"></use> 
                    </svg> -->

                    <h1 class="hero__title">you legal solutions provider</h1>
                    <a href="#services" class="hero__scroll-btn" aria-label="Scroll down">
                        <svg width="36" height="36" class="hero__scroll-icon">
                            <use xlink:href="./sprite.svg#button-scroll"></use>
                        </svg>
                    </a>

                </div>
            </div>
        </section>
    </div>
</body>

</html>
